name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow only checks out code and runs tests. Nothing here
# needs to write to the repo, so don't hand it a token that can.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The suite covers pure logic: SRT shaping, caption chunking, the
      # Deliver-state restore paths and the Lua preset contract. None of it
      # needs Whisper, Resolve or a display, so the heavy backends
      # (mlx-whisper on Mac, faster-whisper on Windows) stay out of CI.
      # numpy and soundfile are the only imports the audio helpers make.
      - name: Install test dependencies
        run: python -m pip install --quiet numpy soundfile

      # -W error::ResourceWarning turns a leaked file handle or subprocess
      # pipe into a failure. Those leaks are invisible in a passing run and
      # are exactly what exhausts handles on a long Windows session.
      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The F rules only (pyflakes: undefined names, unused imports,
      # shadowed definitions). No style opinions, because a reformatting bot
      # editing this codebase would bury the comments that explain the
      # Resolve workarounds. flake8 rather than pyflakes directly because it
      # honours the `# noqa: F401` markers on the deliberate import probes
      # in check.py, which exist to answer "is this backend installed?".
      - name: Install flake8
        run: python -m pip install --quiet flake8

      - name: Check for undefined names and dead imports
        run: python -m flake8 --select=F *.py tests/*.py
